[tool.poetry]
name = "everybody p6codes"
version = "0.1.0"
description = "everybody codes"
authors = ["Me"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.14"
ipykernel = "*"
ipython = "*"
matplotlib = "*"
memory-profiler = "*"
nbformat = "*"
networkx = "*"
numpy = "*"
pipenv = "*"
plotly = "*"
psutil = "*"
pydot = "*"
pytest = "*"
scipy = "*"
tabulate = "*"
termcolor = "*"
treelib = "*"
sortedcontainers = "*"
sympy = "*"
colorama = "^0.4.6"
ipympl = "^0.9.3"
more-itertools = "^10.2.0"
printree = "^0.2.0"
sortedcollections = "^2.1.0"
tk = "^0.1.0"
ipyturtle3 = "^0.1.4"
z3-solver = "^4.15.3.0"
requests = "^2.32.5"
optree = "^0.19.0"
ruff = "^0.15.12"


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "B905", # zip-without-explicit-strict 
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

# [tool.ruff.lint.flake8-quotes]
# multiline-quotes = "single"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
